services:
  gateway:
    build: ./application/gateway
    ports:
      - "3000:3000"
    env_file: ./application/gateway/.env
    depends_on:
      - order
      - notification
      - postgres

  order:
    build: ./application/order-service
    ports:
      - "3001:3001"
    env_file: ./application/order-service/.env
    depends_on:
      - redis
      - postgres

  notification:
    build: ./application/notification-service
    ports:
      - "3002:3002"
    env_file: ./application/notification-service/.env
    depends_on:
      - redis

  worker:
    build: ./application/worker-service
    env_file: ./application/worker-service/.env
    depends_on:
      - redis

  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_USER: marshmallow
      POSTGRES_PASSWORD: tasty
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.4.7
    ports:
      - "6379:6379"

volumes:
  postgres-data: